5. NGOÀI PHẠM VI: không trả lời nội dung câu hỏi; từ chối lịch sự bằng ngôn ngữ của khách, ví dụ tiếng Việt: "Xin lỗi, tôi là trợ lý chuyên về Plei Ơp và các giá trị văn hóa Jrai liên quan. Nội dung này nằm ngoài phạm vi kiến thức đã được xác minh của tôi. Bạn có thể hỏi tôi về Plei Ơp, nhà rông, cây nêu, cồng chiêng hoặc văn hóa Jrai tại địa điểm này."
6. ĐA NGÔN NGỮ: tự nhận diện ngôn ngữ của khách và trả lời bằng chính ngôn ngữ đó (Việt, Anh, Pháp, Trung, Nhật, v.v.). Dịch giữ nguyên ý, không thêm dữ kiện.
7. TIẾNG JRAI: chỉ dùng từ/câu Jrai có trong mục I (JRAI VERIFIED DATA). Không sáng tạo hay dịch sang Jrai bằng suy đoán. Nếu khách yêu cầu tiếng Jrai mà chưa có bản đã xác minh, nói: "Tôi hiểu yêu cầu của bạn, nhưng hiện tôi chưa có bản dịch tiếng Jrai đã được xác minh cho nội dung này. Tôi có thể trả lời bằng tiếng Việt hoặc ngôn ngữ khác." Nếu khách viết bằng tiếng Jrai và bạn hiểu, chỉ truy xuất kiến thức, trả lời bằng ngôn ngữ khác trừ khi có dữ liệu Jrai đã xác minh.
8. PHONG CÁCH: thân thiện, lịch sự, rõ ràng; 2-4 đoạn ngắn; giải thích thuật ngữ cho khách nước ngoài; kể chuyện hấp dẫn nhưng không biến chi tiết hư cấu thành sự thật; tôn trọng tín ngưỡng Jrai, không dùng ngôn từ giật gân hay mê tín hóa. Với câu hỏi hiểu lầm văn hóa (như thương mại hóa hoàn toàn cồng chiêng), phản biện khéo theo hướng bảo tồn bền vững gắn với cộng đồng.
9. TRÍCH NGUỒN: cuối câu trả lời có dòng "Nguồn:" liệt kê tên nguồn (kèm URL nếu có trong <nguon>) thực sự được dùng. Không dùng mã [S1]... trong phần trả lời, và không nêu nguồn nếu đang từ chối.
10. NGỮ CẢNH VR: nếu có <canh_dang_xem>, ưu tiên nội dung đúng cảnh đó rồi gợi ý một điểm liên quan, vẫn chỉ trong CONTEXT.`;

/* ===== MÃ CHATBOT ===== */
const log = document.getElementById("log"), q = document.getElementById("q"),
      sendBtn = document.getElementById("send"), sceneSel = document.getElementById("scene");
const history = []; let sample = null;
SCENES.forEach(s => { const o = document.createElement("option"); o.value = s; o.textContent = "Cảnh đang xem: " + s; sceneSel.appendChild(o); });

function add(role, text) {
  const d = document.createElement("div");
  d.className = "m " + (role === "user" ? "u" : "b");
  d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function buildTurns() {
  const scene = sceneSel.value ? `<canh_dang_xem>${sceneSel.value}</canh_dang_xem>\n` : "";
  const turns = history.map(m => ({ role: m.role, content: m.content }));
  turns[turns.length - 1].content = scene + turns[turns.length - 1].content;
  turns[0].content = `${RULES}\n\n<nguon>${SOURCES}</nguon>\n\n<kien_thuc>${KNOWLEDGE}</kien_thuc>\n\n---\nCâu hỏi của khách:\n` + turns[0].content;
  return turns;
}
async function send(text) {
  text = (text || q.value).trim();
  if (!text || sendBtn.disabled) return;
  q.value = ""; add("user", text); history.push({ role: "user", content: text });
  const bubble = add("assistant", ""); bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  sendBtn.disabled = true;
  try {
    if (!sample) throw { code: "not_granted" };
    const r = await sample(buildTurns(), { cache: false, onText: ({ text }) => { bubble.textContent = text; log.scrollTop = log.scrollHeight; } });
    bubble.textContent = r.text; history.push({ role: "assistant", content: r.text });
  } catch (e) {
    history.pop();
    bubble.textContent = e && e.code === "rate_limited" ? "Bạn hỏi nhanh quá, đợi một chút rồi thử lại nhé."
      : e && e.code === "not_granted" ? "Chatbot cần bạn cho phép sử dụng Claude khi mở trang này."
      : "Xin lỗi, mình đang gặp sự cố. Bạn thử lại sau nhé.";
  }
  sendBtn.disabled = false; q.focus();
}
sceneSel.onchange = () => { const t = HOTSPOT_INTRO[sceneSel.value]; if (t) add("assistant", t); };
sendBtn.onclick = () => send();
q.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
["Làng Plei Ơp có gì đặc sắc?", "Nhà rông và cây nêu có ý nghĩa gì?", "What can I experience in Plei Ơp?", "Quelle est la signification des gongs ?"].forEach(t => {
  const b = document.createElement("button"); b.textContent = t; b.onclick = () => send(t); document.getElementById("chips").appendChild(b);
});
add("assistant", "Kính chào quý khách! Tôi là PLEI OP AI, trợ lý văn hóa của làng Plei Ơp. Bạn có thể hỏi tôi bằng nhiều ngôn ngữ về nhà rông, cây nêu, cồng chiêng, lễ hội và trải nghiệm tại làng.");
(async () => {
  try { sample = await window.claude.use("sample"); } catch (e) { sample = null; }
  if (!sample) { sendBtn.disabled = true; q.placeholder = "Chatbot chưa khả dụng ở môi trường này"; }
})();
</script>
