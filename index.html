<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PLEI OP AI · Làng Plei Ơp</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
  <style>
    /* CSS giao diện cơ bản */
    body { font-family: 'Be Vietnam Pro', sans-serif; margin: 0; padding: 20px; background: #f4f5f7; }
    #log { max-width: 600px; margin: 0 auto 20px; background: #fff; padding: 15px; border-radius: 8px; max-height: 400px; overflow-y: auto; }
    .msg { margin-bottom: 12px; }
    .user { font-weight: 600; color: #0056b3; }
    .assistant { color: #333; }
    .input-area { max-width: 600px; margin: 0 auto; display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 16px; border: none; background: #0056b3; color: white; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .dots i { display: inline-block; width: 4px; height: 4px; margin: 0 1px; background: #333; border-radius: 50%; animation: blink 1.4s infinite; }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  </style>
</head>
<body>

  <div id="log"></div>

  <div class="input-area">
    <input type="text" id="q" placeholder="Nhập tin nhắn..." autocomplete="off">
    <button id="sendBtn">Gửi</button>
  </div>

  <script>
    // --- KHỞI TẠO CÁC PHẦN TỬ PHẦN TỬ GIAO DIỆN ---
    const log = document.getElementById("log");
    const q = document.getElementById("q");
    const sendBtn = document.getElementById("sendBtn");

    // --- KHỞI TẠO & LẤY CAPABILITY CLAUDE ---
    const history = [];
    let sample = null;

    const samplePromise = (async () => {
      try {
        return await window.claude.use("sample");
      } catch (e) {
        return null;
      }
    })();

    // --- HÀM THÊM TIN NHẮN VÀO GIAO DIỆN ---
    function add(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function render(element, text) {
      element.textContent = text;
    }

    function buildTurns() {
      return history.map(h => ({ role: h.role, content: h.content }));
    }

    // --- HÀM GỬI TIN NHẮN ---
    async function send(text) {
      text = (text || q.value).trim();
      if (!text || sendBtn.disabled) return;

      q.value = "";
      add("user", text);
      history.push({ role: "user", content: text });

      const bubble = add("assistant", "");
      bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
      sendBtn.disabled = true;

      try {
        sample = sample || await samplePromise;
        if (!sample) throw { code: "unavailable" };

        const r = await sample(buildTurns(), {
          cache: false,
          onText: ({ text }) => {
            render(bubble, text);
            log.scrollTop = log.scrollHeight;
          }
        });

        render(bubble, r.text);
        history.push({ role: "assistant", content: r.text });
      } catch (e) {
        console.error("sample error:", e);
        history.pop();
        const c = e && e.code;
        bubble.textContent = 
          c === "rate_limited" ? "Bạn hỏi nhanh quá, đợi một chút rồi thử lại nhé." :
          c === "not_granted" ? "Bạn cần cho phép trang sử dụng Claude để chatbot trả lời." :
          (c === "unavailable" || c === "not_declared" || c === "capability_disabled" || c === "sampling_disabled") ? "Chatbot chưa khả dụng trong môi trường này." :
          c === "session_expired" ? "Phiên đăng nhập đã hết hạn, hãy đăng nhập lại rồi thử lại." :
          "Xin lỗi, mình đang gặp sự cố. Bạn thử lại sau nhé.";
      }

      sendBtn.disabled = false;
      q.focus();
    }

    // --- LẮNG NGHE SỰ KIỆN NÚT BẤM VÀ PHÍM ENTER ---
    sendBtn.addEventListener("click", () => send());

    q.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.isComposing) {
        e.preventDefault();
        send();
      }
    });
  </script>
</body>
</html>
