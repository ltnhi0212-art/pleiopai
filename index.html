function withSources(body, list) {
  const ids = [...new Set(list.flatMap(e => e.ids))].sort();
  return body + (ids.length ? "\n\nNguồn:\n" + ids.map(id => SRC[id][0] + (SRC[id][1] ? " - " + SRC[id][1] : "")).join("\n") : "");
}
function answer(text) {
  let n = norm(text);
  if (/^(xin )?chao|^hello|^alo/.test(n) && n.split(" ").length <= 4) return "Kính chào quý khách! Bạn muốn tìm hiểu điều gì về làng Plei Ơp: nhà rông, cây nêu, cồng chiêng, lễ hội hay trải nghiệm tại làng?";
  if (/cam on/.test(n)) return "Rất vui được giúp bạn! Bạn cần tìm hiểu thêm điều gì về làng Plei Ơp không?";
  if (UNVERIFIED.test(n)) return MSG_UNV;
  if (sceneSel.value && /cai nay|noi nay|day la gi|y nghia/.test(n)) n += " " + norm(sceneSel.value);
  if (/dac sac|gioi thieu|tong quan|noi bat|co gi hay/.test(n) && /lang|plei/.test(n)) {
    const list = [pick("A", 0), pick("B", 0), pick("C", 1), pick("F", 0)];
    return withSources("Theo tài liệu của dự án:\n\n" + list.map(e => "• " + e.text).join("\n"), list);
  }
  let extra = "", dyn = false;
  DYN.forEach(([re, x]) => { if (re.test(n)) { dyn = true; extra += " " + x; } });
  SYN.forEach(([a, b]) => { if (n.includes(a)) extra += " " + b; });
  const qt = toks(n + " " + extra);
  const scored = (dyn ? ENTRIES.filter(e => e.dyn) : ENTRIES).map(e => [score(qt, e), e]).sort((x, y) => y[0] - x[0]);
  const best = scored[0] ? scored[0][0] : 0;
  if (dyn) {
    const list = best >= 2 ? scored.slice(0, 2).filter(([s]) => s >= best * 0.6).map(x => x[1]) : [];
    return list.length ? withSources(MSG_DYN + "\n\nThông tin cũ để bạn tham khảo (có thể đã thay đổi):\n" + list.map(e => "• " + e.text).join("\n"), list) : MSG_DYN;
  }
  if (best < 2 || ![...qt].some(k => ANCHOR.has(k))) return MSG_OUT;
  const list = scored.slice(0, 3).filter(([s]) => s >= best * 0.6).map(x => x[1]);
  return withSources("Theo tài liệu của dự án:\n\n" + list.map(e => "• " + e.text).join("\n"), list);
}

function add(role, text) {
  const d = document.createElement("div");
  d.className = "m " + (role === "user" ? "u" : "b");
  d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function render(el, text) {
  const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  el.innerHTML = esc.replace(/(https?:\/\/[^\s<>"')\]]+?)([.,;:!?]*)(?=\s|$|[)\]])/g,
    (m, url, tail) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${tail}`);
}
async function send(text) {
  text = (text || q.value).trim();
  if (!text || sendBtn.disabled) return;
  q.value = ""; add("user", text);
  const bubble = add("assistant", ""); bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  sendBtn.disabled = true;
  await new Promise(r => setTimeout(r, 400));
  try { render(bubble, answer(text)); } catch (e) { bubble.textContent = "Xin lỗi, mình đang gặp sự cố. Bạn thử lại sau nhé."; }
  log.scrollTop = log.scrollHeight; sendBtn.disabled = false; q.focus();
}
sceneSel.onchange = () => { const t = HOTSPOT_INTRO[sceneSel.value]; if (t) add("assistant", t); };
sendBtn.onclick = () => send();
q.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
["Làng Plei Ơp có gì đặc sắc?", "Nhà rông và cây nêu có ý nghĩa gì?", "Ở làng có những món ăn gì?", "Cồng chiêng có ý nghĩa gì?"].forEach(t => {
  const b = document.createElement("button"); b.textContent = t; b.onclick = () => send(t); document.getElementById("chips").appendChild(b);
});
add("assistant", "Kính chào quý khách! Tôi là PLEI OP AI, trợ lý văn hóa của làng Plei Ơp. Bạn có thể hỏi tôi về nhà rông, cây nêu, cồng chiêng, lễ hội và trải nghiệm tại làng.");
</script>
