## A. Vị trí, quy mô, tên gọi

## C. Cồng chiêng và truyền dạy
- Cồng chiêng là nhạc khí tự vang bằng hợp kim đồng. "Cồng" có núm ở giữa, "chiêng" có mặt phẳng không núm; diễn tấu bằng dùi hoặc tay trần. [S1]
- Cồng chiêng là nhạc khí thiêng, vật trung gian nối con người với thần linh (Yàng); mỗi chiếc chiêng có thần trú ngụ, chiêng càng cổ càng linh thiêng; âm thanh phản ánh sự giao hòa giữa con người và thiên nhiên. [S1]

  }
  let extra = "", dyn = false, topic = "";
  DYN.forEach(([re, x]) => { if (re.test(n)) { dyn = true; topic += " " + x; } });
  if (dyn) {
    const sd = ENTRIES.filter(e => e.dyn).map(e => [score(toks(topic), new Set(), e), e]).sort((x, y) => y[0] - x[0]);
    const list = topic.trim() && sd[0] && sd[0][0] >= 2 ? sd.slice(0, 2).filter(([s]) => s >= sd[0][0] * 0.6).map(x => x[1]) : [];
    return list.length ? withSources(MSG_DYN + "\n\nThông tin cũ để bạn tham khảo (có thể đã thay đổi):\n" + list.map(e => "• " + e.text).join("\n"), list) : MSG_DYN;
  }
  const padded = " " + n + " ";
  SYN.forEach(([a, b]) => { if (padded.includes(" " + a + " ")) extra += " " + b; });
  const qt = toks(n + " " + extra), qx = exact(text);
  const food = /am thuc|mon an|an gi|an uong|do an|dac san|nha hang/.test(n);
  const pool = food ? ENTRIES.filter(e => e.sec.startsWith("G")) : ENTRIES;
  const scored = pool.map(e => { const r = score(qt, qx, e); return [r, r / Math.pow(e.len, 0.2), e]; }).sort((x, y) => y[1] - x[1]);
  const raw = scored[0] ? scored[0][0] : 0, best = scored[0] ? scored[0][1] : 0;
  if (raw < 2 || ![...qt].some(k => ANCHOR.has(k))) return MSG_OUT;
  const list = scored.slice(0, 3).filter(x => x[1] >= best * 0.6).map(x => x[2]);
  return withSources("Theo tài liệu của dự án:\n\n" + list.map(e => "• " + e.text).join("\n"), list);
}

function add(role, text) {
  const d = document.createElement("div");
  d.className = "m " + (role === "user" ? "u" : "b");
  d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function render(el, text) {
  const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  el.innerHTML = esc.replace(/(https?:\/\/[^\s<>"')\]]+?)([.,;:!?]*)(?=\s|$|[)\]])/g,
    (m, url, tail) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${tail}`);
}
async function send(text) {
  text = (text || q.value).trim();
  if (!text || sendBtn.disabled) return;
  q.value = ""; add("user", text);
  const bubble = add("assistant", ""); bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  sendBtn.disabled = true;
  await new Promise(r => setTimeout(r, 400));
  try { render(bubble, answer(text)); } catch (e) { bubble.textContent = "Xin lỗi, mình đang gặp sự cố. Bạn thử lại sau nhé."; }
  log.scrollTop = log.scrollHeight; sendBtn.disabled = false; q.focus();
}
sceneSel.onchange = () => { const t = HOTSPOT_INTRO[sceneSel.value]; if (t) add("assistant", t); };
sendBtn.onclick = () => send();
q.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
["Làng Plei Ơp có gì đặc sắc?", "Nhà rông và cây nêu có ý nghĩa gì?", "Ở làng có những món ăn gì?", "Cồng chiêng có ý nghĩa gì?"].forEach(t => {
  const b = document.createElement("button"); b.textContent = t; b.onclick = () => send(t); document.getElementById("chips").appendChild(b);
});
add("assistant", "Kính chào quý khách! Tôi là PLEI OP AI, trợ lý văn hóa của làng Plei Ơp. Bạn có thể hỏi tôi về nhà rông, cây nêu, cồng chiêng, lễ hội và trải nghiệm tại làng.");
</script>
